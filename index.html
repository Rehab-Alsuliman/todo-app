<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart To Do List</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      background: #f2f2f2;
    }

    h1 {
      text-align: center;
      padding: 20px;
      background-color: #4CAF50;
      color: white;
    }

    .columns {
      display: flex;
      justify-content: space-around;
      margin: 20px;
    }

    .column {
      background: white;
      width: 30%;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .column h2 {
      text-align: center;
      border-bottom: 1px solid #ccc;
      padding-bottom: 5px;
    }

    .task {
      background-color: #e0e0e0;
      margin: 5px 0;
      padding: 8px;
      border-radius: 5px;
    }

    input[type="text"] {
      width: 80%;
      padding: 5px;
      margin: 5px auto;
    }

    button {
      margin-top: 5px;
      padding: 5px 10px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <h1>🧠 Smart To Do List</h1>

  <div class="columns">
    <div class="column" id="todo">
      <h2>To Do</h2>
      <input type="text" id="todo-input" placeholder="Add task...">
      <button onclick="addTask('todo')">Add</button>
      <div id="todo-tasks"></div>
    </div>
    <div class="column" id="inprogress">
      <h2>In Progress</h2>
      <input type="text" id="inprogress-input" placeholder="Add task...">
      <button onclick="addTask('inprogress')">Add</button>
      <div id="inprogress-tasks"></div>
    </div>
    <div class="column" id="done">
      <h2>Done</h2>
      <input type="text" id="done-input" placeholder="Add task...">
      <button onclick="addTask('done')">Add</button>
      <div id="done-tasks"></div>
    </div>
  </div>

  <div class="footer">
    <button onclick="saveTasks()">💾 Save Today's Tasks</button>
  </div>

  <script>
    const taskData = {
      todo: [],
      inprogress: [],
      done: []
    };

    function addTask(columnId) {
      const input = document.getElementById(`${columnId}-input`);
      const taskText = input.value.trim();
      if (taskText === "") return;

      taskData[columnId].push(taskText);
      renderTasks();
      input.value = "";
    }

    function renderTasks() {
      ["todo", "inprogress", "done"].forEach(column => {
        const container = document.getElementById(`${column}-tasks`);
        container.innerHTML = "";
        taskData[column].forEach(task => {
          const div = document.createElement("div");
          div.className = "task";
          div.innerText = task;
          container.appendChild(div);
        });
      });
    }

    function saveTasks() {
      const today = new Date().toISOString().split('T')[0];
      const fileName = `tasks-${today}.txt`;
      const content = `Tasks for ${today}\n\nTo Do:\n${taskData.todo.join('\n')}\n\nIn Progress:\n${taskData.inprogress.join('\n')}\n\nDone:\n${taskData.done.join('\n')}`;
      
      const blob = new Blob([content], { type: "text/plain" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = fileName;
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
